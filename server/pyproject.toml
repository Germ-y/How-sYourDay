[project]
name = "hows-your-day-server"
version = "0.1.0"
description = "Emotion-aware daily planning agent harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "bcrypt>=4.1.0",
  "python-jose[cryptography]>=3.3.0",
  "email-validator>=2.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.setuptools.packages.find]
include = [
  "agent*",
  "api*",
  "auth*",
  "db*",
  "memory*",
  "planner*",
  "prompts*",
  "repositories*",
  "tools*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
